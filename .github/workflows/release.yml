# Publishes a release: the container image an operator deploys, and the CLI
# binaries a developer installs.
#
# Both come from the same tag, so "quai" on a laptop and the image on the server
# are always the same build. The image is what deploy/compose.yaml points at, so
# without this workflow those instructions refer to something that does not
# exist.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write
  # Required by 'npm publish --provenance', which signs the package against
  # this workflow run. Without it the publish fails outright.
  id-token: write

jobs:
  verify:
    name: Tests and isolation guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: The guarantees must hold before anything is published
        run: |
          docker build -t quai:release .
          bash test/integration.sh quai:release

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A host is x86 or ARM; publishing both means the same tag works
          # wherever the operator runs it.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: CLI binaries
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # A stuck runner must not hold the other builds hostage.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Compile a standalone binary
        # Compiled rather than shipped as source: the developer installing the
        # CLI should not have to install a runtime first.
        run: |
          # The tag is baked in so 'quai update' can tell whether it is
          # already current instead of downloading blindly.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building quai $VERSION for ${{ matrix.target }}"
          QUAI_BUILD_VERSION="$VERSION" bun build --compile --minify \
            --define "process.env.QUAI_BUILD_VERSION='$VERSION'" \
            --outfile "quai-${{ matrix.target }}" \
            src/cli/main.ts

      - name: Check it runs
        run: "./quai-${{ matrix.target }} --help"

      - uses: actions/upload-artifact@v4
        with:
          name: "quai-${{ matrix.target }}"
          path: "quai-${{ matrix.target }}"

  npm:
    name: Types package
    needs: verify
    runs-on: ubuntu-latest
    # The publish token lives on this environment; a job that does not declare
    # it cannot see the secret at all.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Match the package version to the tag
        # The types describe a specific release of the product, so publishing
        # them under a different number would make the pairing guesswork.
        working-directory: packages/quai
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: packages/quai
        run: npm install && npm run build

      - name: Publish
        working-directory: packages/quai
        # Skipped rather than failed when no token is configured: the types are
        # a convenience, and a missing npm credential should not stop the image
        # and the CLI — the things an operator actually needs — from shipping.
        #
        # The token must be a granular access token with 'bypass 2FA' enabled.
        # An account with two-factor publishing turned on rejects a classic
        # token with a 403 that names neither the account nor the setting.
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the types package."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish the release
    # The npm job is advisory; a missing token must not hold the release.
    needs: [image, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # Only the CLI builds: the build step also uploads a .dockerbuild
          # record, and pulling everything made the download fail outright.
          pattern: quai-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum quai-* > checksums.txt
          cat checksums.txt

      - name: Publish the installer alongside the binaries
        # Shipping install.sh as a release asset is what lets the documented
        # URL point at a tag instead of a branch: a branch would hand out
        # whatever was merged last, which is not a release anyone tested.
        run: |
          cp install.sh artifacts/install.sh
          cp schema/quai.schema.json artifacts/quai.schema.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/quai-*
            artifacts/checksums.txt
            artifacts/install.sh
            artifacts/quai.schema.json

