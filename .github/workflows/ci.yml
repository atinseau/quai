# Checks that run on every push and pull request.
#
# The unit tests answer "are the decisions right"; the integration suite answers
# "are the guarantees real". Only the second can catch an isolation regression,
# because isolation is enforced by the kernel — so it runs here too, on a real
# container with a real XFS volume, not just on a developer's machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in progress: nobody needs the result of a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run format:check

      - name: Types
        run: bun run typecheck

      - name: The published types must compile on their own
        working-directory: packages/quai-types
        run: bun install && bunx tsc -p tsconfig.build.json

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile
      - run: bun test

  integration:
    name: Isolation guarantees
    runs-on: ubuntu-latest
    # Slower than the unit tests but the only thing that proves the product
    # actually isolates anything.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t quai:ci .

      - name: Run the integration suite
        # The XFS volume is built inside the privileged container, which ships
        # xfsprogs, so the runner itself needs nothing beyond Docker.
        run: bash test/integration.sh quai:ci

      - name: Show the container log on failure
        if: failure()
        run: docker logs quai-integration 2>&1 | tail -40 || true

  nested:
    name: Isolation guarantees, nested
    runs-on: ubuntu-latest
    # deploy/nested/compose.yaml offers a host a way to run Quai without
    # granting cgroup access, SYS_ADMIN or an XFS mount of its own. That is only
    # worth offering if the isolation survives the nesting, so the whole suite
    # runs again inside a Docker-in-Docker host.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t quai:ci .

      - name: Run the nested suite
        run: bash test/nested.sh quai:ci

      - name: Show the nested host log on failure
        if: failure()
        run: docker logs quai-nested-test 2>&1 | tail -60 || true

  proxy:
    name: Routing through a proxy
    runs-on: ubuntu-latest
    # The overlay in deploy/overlays/ claims a request reaches the right project
    # with its Host header intact. That is a claim about software Quai does not
    # control, so it is worth nothing until a real proxy has forwarded a real
    # request.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t quai:ci .

      - name: Run the proxy suite
        run: bash test/proxy.sh quai:ci

      - name: Show the proxy log on failure
        if: failure()
        run: docker logs quai-proxy-test-traefik 2>&1 | tail -40 || true

  scripts:
    name: Shell and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the scripts that run on a real host
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            install.sh deploy/entrypoint.sh deploy/forced-command.sh \
            deploy/nested/boot.sh test/integration.sh test/nested.sh test/proxy.sh

      - name: The deployment file must stay valid
        # An operator pastes this into Coolify; a broken one is only discovered
        # at deploy time otherwise.
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/nested/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml \
            -f deploy/overlays/traefik.yaml config --quiet
          docker compose -f deploy/nested/compose.yaml \
            -f deploy/overlays/traefik-nested.yaml config --quiet
