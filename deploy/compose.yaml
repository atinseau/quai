# Quai — paste this into Coolify as a Raw Compose deployment.
#
# The settings below are not optional. The prototype established that without
# 'cgroup: host' a memory cap is written without error and contains nothing,
# and that 'privileged: true' does NOT substitute for the explicit cgroup
# mount. The supervisor verifies all of this at startup — including really
# attempting the delegation — and refuses to run rather than offer isolation
# it cannot enforce.
#
# Before the first deploy, add your public key to the state volume:
#
#   docker compose exec quai sh -c 'echo "ssh-ed25519 AAAA... you@host" \
#     >> /srv/quai/state/authorized_keys'
#   docker compose restart quai
#
# Every key is pinned to a forced command, so it can only ever deploy.
# Then, on your machine:
#
#   quai login root@<host> quai.<your-domain>

services:
  quai:
    # A pasted Raw Compose carries no build context, so Quai is deployed from a
    # published image. Build locally with: docker build -t quai:local .
    image: ${QUAI_IMAGE:-ghcr.io/atinseau/quai:latest}
    restart: unless-stopped

    # Lets the container see its real cgroup path and place projects under it.
    cgroup: host

    cap_add:
      - NET_ADMIN # per-project network namespaces and egress rules
      - SYS_ADMIN # namespace creation and mount operations

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Project homes MUST sit on an XFS filesystem mounted with prjquota.
      # overlayfs cannot carry per-project disk quotas, so this has to be a
      # bind mount onto a real XFS volume prepared on the host:
      #   mkfs.xfs /dev/<device>
      #   mount -o prjquota /dev/<device> /srv/quai-homes
      - ${QUAI_HOMES_DEVICE:-/srv/quai-homes}:/srv/quai/homes
      - quai-state:/srv/quai/state

    ports:
      # The deploy channel. Keys are pinned to a forced command, so this port
      # grants deployment and nothing else.
      - "${QUAI_SSH_PORT:-2222}:22"

    environment:
      QUAI_HOMES: /srv/quai/homes
      QUAI_STATE: /srv/quai/state
      QUAI_PORT: "8080"
      # The wildcard zone projects are served under. Point *.quai.<domain> at
      # this service in Coolify, which terminates TLS with one wildcard
      # certificate for every project.
      QUAI_ZONE: ${QUAI_ZONE:-quai.localhost}

    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  quai-state:

